<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#071015" />
    <title>SystemForge local mode</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #071015;
        color: #d8e1e3;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 560px;
        padding: 34px;
        border: 1px solid #31464f;
        background: #0a151a;
      }
      span {
        color: #72d4cb;
        font: 700 11px monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      h1 {
        font-size: 34px;
        line-height: 1.1;
      }
      p {
        color: #91a3a9;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 14px;
        border: 1px solid #4b706f;
        color: #9be7df;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <span>Graceful degradation</span>
      <h1>The server is recovering.</h1>
      <p>
        If you have opened SystemForge before, return to the installed or cached
        lab to keep building and running simulations locally. Canonical
        submissions will resume when capacity is available.
      </p>
      <a href="/lab">Try the local lab</a>
    </main>
  </body>
</html>
