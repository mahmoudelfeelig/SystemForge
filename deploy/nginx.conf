worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types application/javascript application/json text/css text/plain image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=0, s-maxage=300, stale-if-error=86400" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /offline.html;
    location = /offline.html {
      internal;
      add_header Cache-Control "no-store" always;
    }
  }
}
