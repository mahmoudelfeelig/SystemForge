name: SystemForge Production Monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: systemforge-production-monitor
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      vars.HETZNER_DEPLOY_ENABLED == 'true' &&
      vars.SYSTEMFORGE_RELEASE_APPROVED == 'I_AM_READY_FOR_PRODUCTION' &&
      vars.SYSTEMFORGE_EXTERNAL_SMOKE_URL == 'https://systemforge.elfeel.me'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify Cloudflare origin ranges have not drifted
        run: sh scripts/verify_cloudflare_ranges.sh
      - name: Check browser shell and canonical readiness
        run: |
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 15 https://systemforge.elfeel.me/ | grep -q SystemForge
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 15 https://systemforge.elfeel.me/api/health/ready | grep -q '"status":"ready"'
