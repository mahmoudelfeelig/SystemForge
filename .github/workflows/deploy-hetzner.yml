name: Deploy SystemForge to Hetzner

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact lowercase 40-character SHA from a successful main CI run
        required: true
        type: string
      ci_run_id:
        description: Numeric run ID for the successful SystemForge CI main push
        required: true
        type: string
      confirmation:
        description: Type AUTHORIZE_SYSTEMFORGE_PRODUCTION_RELEASE exactly
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: systemforge-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.release.outputs.ci_run_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Validate the requested release against trusted CI
        id: release
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if test "$RELEASE_CONFIRMATION" != AUTHORIZE_SYSTEMFORGE_PRODUCTION_RELEASE; then
            echo "Production release confirmation did not match the required phrase." >&2
            exit 78
          fi
          if test "${#RELEASE_SHA}" -ne 40; then
            echo "release_sha must be exactly 40 lowercase hexadecimal characters." >&2
            exit 64
          fi
          case "$RELEASE_SHA" in
            *[!0-9a-f]*)
              echo "release_sha must be exactly 40 lowercase hexadecimal characters." >&2
              exit 64
              ;;
          esac
          case "$CI_RUN_ID" in
            ""|*[!0-9]*)
              echo "ci_run_id must contain decimal digits only." >&2
              exit 64
              ;;
          esac
          if test "$DISPATCH_REF" != refs/heads/main; then
            echo "Production release dispatches must execute from refs/heads/main." >&2
            exit 78
          fi
          if test "$DISPATCH_SHA" != "$RELEASE_SHA"; then
            echo "The executing workflow revision does not match release_sha." >&2
            exit 75
          fi

          RUN_METADATA="$RUNNER_TEMP/systemforge-ci-run.json"
          MAIN_METADATA="$RUNNER_TEMP/systemforge-main-ref.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RUN_METADATA" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID"
          jq --exit-status \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg run_id "$CI_RUN_ID" \
            --arg sha "$RELEASE_SHA" \
            '(.id | tostring) == $run_id and
             .status == "completed" and
             .conclusion == "success" and
             .event == "push" and
             .head_branch == "main" and
             .head_sha == $sha and
             .repository.full_name == $repo and
             .head_repository.full_name == $repo and
             .name == "SystemForge CI" and
             .path == ".github/workflows/ci.yml"' \
            "$RUN_METADATA" >/dev/null

          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$MAIN_METADATA" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          CURRENT_MAIN_SHA=$(jq --exit-status --raw-output '.object.sha' "$MAIN_METADATA")
          if test "$CURRENT_MAIN_SHA" != "$RELEASE_SHA"; then
            echo "Release $RELEASE_SHA was superseded by main revision $CURRENT_MAIN_SHA." >&2
            exit 75
          fi

          printf 'ci_run_id=%s\n' "$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'release_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  stage:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download the exact CI-tested release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: systemforge-images-${{ needs.validate.outputs.release_sha }}
          path: ${{ runner.temp }}/systemforge-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate.outputs.ci_run_id }}

      - name: Verify the release-image bundle
        run: |
          cd "$RUNNER_TEMP/systemforge-release"
          sha256sum --check systemforge-images.tar.gz.sha256

      - name: Configure Hetzner SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/systemforge_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/systemforge_deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Stage the tested main revision
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.release_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_BUNDLE: ${{ runner.temp }}/systemforge-release/systemforge-images.tar.gz
          SSH_HOST: ${{ vars.HETZNER_HOST }}
          SSH_PORT: ${{ vars.HETZNER_SSH_PORT }}
          SSH_USER: ${{ vars.HETZNER_USER }}
        run: |
          test -n "$DEPLOY_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -f "$RELEASE_BUNDLE"
          if test "$RELEASE_CONFIRMATION" != AUTHORIZE_SYSTEMFORGE_PRODUCTION_RELEASE; then
            echo "Production release confirmation did not match the required phrase." >&2
            exit 78
          fi
          SSH_PORT="${SSH_PORT:-22}"
          scp \
            -i "$HOME/.ssh/systemforge_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "$SSH_PORT" \
            "$RELEASE_BUNDLE" \
            "$SSH_USER@$SSH_HOST:/tmp/systemforge-images-$DEPLOY_SHA.tar.gz"
          ssh \
            -i "$HOME/.ssh/systemforge_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "set -eu
             trap 'rm -f /tmp/systemforge-images-$DEPLOY_SHA.tar.gz' EXIT HUP INT TERM
             cd /opt/systemforge
             test -z \"\$(git status --porcelain)\"
             git fetch origin main
             if test \"\$(git rev-parse origin/main)\" != \"$DEPLOY_SHA\"; then
               echo \"Staging refused because $DEPLOY_SHA was superseded by a newer main revision.\" >&2
               exit 75
             fi
             docker load --input /tmp/systemforge-images-$DEPLOY_SHA.tar.gz
             git checkout main
             git pull --ff-only origin main
             test \"\$(git rev-parse HEAD)\" = \"$DEPLOY_SHA\"
             SYSTEMFORGE_RELEASE_CONFIRMATION=$RELEASE_CONFIRMATION \
             sh scripts/stage_hetzner.sh \"$DEPLOY_SHA\""

  deploy:
    needs: [validate, stage]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure deployment SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/systemforge_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/systemforge_deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Revalidate the release before production mutation
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.release_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MAIN_METADATA="$RUNNER_TEMP/systemforge-main-ref-before-deploy.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$MAIN_METADATA" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          CURRENT_MAIN_SHA=$(jq --exit-status --raw-output '.object.sha' "$MAIN_METADATA")
          if test "$CURRENT_MAIN_SHA" != "$DEPLOY_SHA"; then
            echo "Release $DEPLOY_SHA was superseded before production mutation by $CURRENT_MAIN_SHA." >&2
            exit 75
          fi

      - name: Provision encrypted off-site backups
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.release_sha }}
          R2_ACCESS_KEY_ID: ${{ secrets.SYSTEMFORGE_R2_ACCESS_KEY_ID }}
          R2_ACCOUNT_ID: ${{ vars.SYSTEMFORGE_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.SYSTEMFORGE_R2_BUCKET }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SYSTEMFORGE_R2_SECRET_ACCESS_KEY }}
          RESTIC_BINARY_SHA256: 20d4142678d0d95ec11a4759def1b73fd9190abc9ca19e4b62d067c0b387e639
          RESTIC_RELEASE_SHA256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
          RESTIC_RELEASE_VERSION: 0.19.1
          RESTIC_PASSWORD: ${{ secrets.SYSTEMFORGE_RESTIC_PASSWORD }}
          SSH_HOST: ${{ vars.HETZNER_HOST }}
          SSH_PORT: ${{ vars.HETZNER_SSH_PORT }}
          SSH_USER: ${{ vars.HETZNER_USER }}
        run: |
          test -n "$DEPLOY_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          case "$R2_ACCOUNT_ID" in
            ""|*[!0-9a-f]*)
              echo "SYSTEMFORGE_R2_ACCOUNT_ID must be exactly 32 lowercase hexadecimal characters." >&2
              exit 64
              ;;
          esac
          test "${#R2_ACCOUNT_ID}" -eq 32
          case "$R2_BUCKET" in
            ""|*[!a-z0-9-]*|-*|*-)
              echo "SYSTEMFORGE_R2_BUCKET is not a valid bucket name." >&2
              exit 64
              ;;
          esac
          test "${#R2_BUCKET}" -ge 3
          test "${#R2_BUCKET}" -le 64
          case "$R2_ACCESS_KEY_ID" in
            ""|*[!A-Za-z0-9]*) echo "SYSTEMFORGE_R2_ACCESS_KEY_ID is missing or malformed." >&2; exit 64 ;;
          esac
          test "${#R2_ACCESS_KEY_ID}" -eq 32
          case "$R2_SECRET_ACCESS_KEY" in
            ""|*[!0-9a-f]*) echo "SYSTEMFORGE_R2_SECRET_ACCESS_KEY is missing or malformed." >&2; exit 64 ;;
          esac
          test "${#R2_SECRET_ACCESS_KEY}" -eq 64
          test -n "$RESTIC_PASSWORD"
          case "$RESTIC_PASSWORD" in
            *$'\n'*|*$'\r'*) echo "SYSTEMFORGE_RESTIC_PASSWORD must be one line." >&2; exit 64 ;;
          esac
          SSH_PORT="${SSH_PORT:-22}"
          CONFIG_SOURCE="$RUNNER_TEMP/systemforge-offsite-$DEPLOY_SHA.env"
          PASSWORD_SOURCE="$RUNNER_TEMP/systemforge-restic-$DEPLOY_SHA.password"
          RESTIC_ARCHIVE="$RUNNER_TEMP/restic-$DEPLOY_SHA.bz2"
          RESTIC_SOURCE="$RUNNER_TEMP/restic-$DEPLOY_SHA"
          umask 077
          trap 'rm -f "$CONFIG_SOURCE" "$PASSWORD_SOURCE" "$RESTIC_ARCHIVE" "$RESTIC_SOURCE"' EXIT HUP INT TERM
          curl --fail --location --silent --show-error \
            --output "$RESTIC_ARCHIVE" \
            "https://github.com/restic/restic/releases/download/v$RESTIC_RELEASE_VERSION/restic_${RESTIC_RELEASE_VERSION}_linux_amd64.bz2"
          actual_sha=$(sha256sum "$RESTIC_ARCHIVE")
          test "${actual_sha%% *}" = "$RESTIC_RELEASE_SHA256"
          bzip2 --decompress --stdout "$RESTIC_ARCHIVE" > "$RESTIC_SOURCE"
          binary_sha=$(sha256sum "$RESTIC_SOURCE")
          test "${binary_sha%% *}" = "$RESTIC_BINARY_SHA256"
          chmod 700 "$RESTIC_SOURCE"
          "$RESTIC_SOURCE" version | grep -Fq "restic $RESTIC_RELEASE_VERSION"
          {
            printf 'RESTIC_REPOSITORY=s3:https://%s.r2.cloudflarestorage.com/%s\n' "$R2_ACCOUNT_ID" "$R2_BUCKET"
            printf 'AWS_ACCESS_KEY_ID=%s\n' "$R2_ACCESS_KEY_ID"
            printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$R2_SECRET_ACCESS_KEY"
            printf 'AWS_DEFAULT_REGION=auto\n'
            printf 'RESTIC_PASSWORD_FILE=/opt/systemforge-backups/.offsite/restic-password\n'
            printf 'RESTIC_CACHE_DIR=/opt/systemforge-backups/.offsite/cache\n'
          } > "$CONFIG_SOURCE"
          printf '%s\n' "$RESTIC_PASSWORD" > "$PASSWORD_SOURCE"
          chmod 600 "$CONFIG_SOURCE" "$PASSWORD_SOURCE"
          scp \
            -i "$HOME/.ssh/systemforge_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -P "$SSH_PORT" \
            "$CONFIG_SOURCE" \
            "$PASSWORD_SOURCE" \
            "$RESTIC_SOURCE" \
            "$SSH_USER@$SSH_HOST:/tmp/"
          ssh \
            -i "$HOME/.ssh/systemforge_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "set -eu
             trap 'rm -f /tmp/systemforge-offsite-$DEPLOY_SHA.env /tmp/systemforge-restic-$DEPLOY_SHA.password /tmp/restic-$DEPLOY_SHA' EXIT HUP INT TERM
             cd /opt/systemforge
             git fetch origin main
             if test \"\$(git rev-parse origin/main)\" != \"$DEPLOY_SHA\"; then
               echo \"Backup provisioning refused because $DEPLOY_SHA was superseded by a newer main revision.\" >&2
               exit 75
             fi
             test \"\$(git rev-parse HEAD)\" = \"$DEPLOY_SHA\"
             SYSTEMFORGE_BACKUP_DIR=/opt/systemforge-backups \
             SYSTEMFORGE_OFFSITE_TARGET_DIR=/opt/systemforge-backups/.offsite \
             SYSTEMFORGE_OFFSITE_CONFIG=/opt/systemforge-backups/.offsite/offsite-backup.env \
             SYSTEMFORGE_RESTIC_PASSWORD_FILE=/opt/systemforge-backups/.offsite/restic-password \
             SYSTEMFORGE_RESTIC_BIN=/opt/systemforge-backups/.offsite/restic \
             SYSTEMFORGE_RESTIC_SHA256=$RESTIC_BINARY_SHA256 \
             sh scripts/provision_offsite_backup.sh \
               /tmp/systemforge-offsite-$DEPLOY_SHA.env \
               /tmp/systemforge-restic-$DEPLOY_SHA.password \
               /tmp/restic-$DEPLOY_SHA"

      - name: Deploy the staged main revision
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.release_sha }}
          EXTERNAL_SMOKE_URL: ${{ vars.SYSTEMFORGE_EXTERNAL_SMOKE_URL }}
          SSH_HOST: ${{ vars.HETZNER_HOST }}
          SSH_PORT: ${{ vars.HETZNER_SSH_PORT }}
          SSH_USER: ${{ vars.HETZNER_USER }}
        run: |
          test -n "$DEPLOY_SHA"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          case "$EXTERNAL_SMOKE_URL" in
            ""|https://systemforge.elfeel.me) ;;
            *) echo "SYSTEMFORGE_EXTERNAL_SMOKE_URL is not the approved production origin." >&2; exit 64 ;;
          esac
          SSH_PORT="${SSH_PORT:-22}"
          ssh \
            -i "$HOME/.ssh/systemforge_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "set -eu
             cd /opt/systemforge
             git fetch origin main
             if test \"\$(git rev-parse origin/main)\" != \"$DEPLOY_SHA\"; then
               echo \"Deployment refused because $DEPLOY_SHA was superseded by a newer main revision.\" >&2
               exit 75
             fi
             test \"\$(git rev-parse HEAD)\" = \"$DEPLOY_SHA\"
             SYSTEMFORGE_RELEASE_APPROVED=I_AM_READY_FOR_PRODUCTION \
             SYSTEMFORGE_EXTERNAL_SMOKE_URL=$EXTERNAL_SMOKE_URL \
             SYSTEMFORGE_OFFSITE_CONFIG=/opt/systemforge-backups/.offsite/offsite-backup.env \
             SYSTEMFORGE_RESTIC_BIN=/opt/systemforge-backups/.offsite/restic \
             SYSTEMFORGE_SKIP_BUILD=true \
             sh scripts/deploy_hetzner.sh \"$DEPLOY_SHA\""
